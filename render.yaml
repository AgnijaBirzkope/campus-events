services:
  - type: web
    name: campus-events
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_STORAGE
        value: /tmp/events.sqlite
      - key: CACHE_TTL_MS
        value: 30000
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
